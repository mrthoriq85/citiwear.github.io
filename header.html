<!-- 1. NOTIFICATION BAR -->
<div class="bg-stone-950 text-stone-200 py-2.5 text-[10px] font-bold tracking-[0.2em] uppercase border-b border-white/10 overflow-hidden whitespace-nowrap relative flex">
  <div class="animate-marquee flex gap-12 invisible-scrollbar" aria-label="Pengumuman Promo">
    <span>⚡ SPECIAL PROMO: GRATIS ONGKIR SELURUH INDONESIA UNTUK PEMBELIAN DI ATAS RP 300.000 ⚡</span>
    <span>⚡ SPECIAL PROMO: GRATIS ONGKIR SELURUH INDONESIA UNTUK PEMBELIAN DI ATAS RP 300.000 ⚡</span>
  </div>
</div>

<!-- 2. NAVIGATION BAR -->
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="index.html" class="hover:opacity-80 transition-opacity" aria-label="Halaman Utama Citiwear Basic">
      <img
        src="img/logo.png"
        alt="Logo Citiwear Basic"
        width="120"
        height="24"
        class="h-6 w-auto object-contain"
      />
    </a>

    <!-- Navigasi Desktop -->
    <nav class="hidden md:flex space-x-10 text-[11px] font-semibold tracking-[0.2em] uppercase" aria-label="Navigasi Utama">
      <button
        type="button"
        @click="currentCategory = 'all'"
        :class="currentCategory === 'all' ? 'text-black border-b-2 border-black' : 'text-stone-600 hover:text-black'"
        class="pb-1 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-black"
      >
        All
      </button>
      <button
        type="button"
        @click="currentCategory = 'tshirt'"
        :class="currentCategory === 'tshirt' ? 'text-black border-b-2 border-black' : 'text-stone-600 hover:text-black'"
        class="pb-1 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-black"
      >
        T-Shirts
      </button>
    </nav>

    <!-- Tombol Keranjang -->
    <button
      type="button"
      @click="cartOpen = true"
      aria-label="Buka Keranjang Belanja"
      class="flex items-center space-x-1.5 text-stone-800 hover:text-black transition group relative focus:outline-none focus:ring-2 focus:ring-black p-1"
    >
      <svg class="h-6 w-6 stroke-[1.25]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1,0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0,1-1.119-1.243l1.264-12A1.125 1.125 0 0,1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1,1-.75 0 .375.375 0 0,1 .75 0Zm7.5 0a.375.375 0 1,1-.75 0 .375.375 0 0,1 .75 0Z" />
      </svg>
      <span
        class="text-xs font-medium bg-stone-900 text-white min-w-[18px] h-[18px] flex items-center justify-center rounded-full text-[10px]"
        x-text="cartCount()"
        aria-live="polite"
      >0</span>
    </button>
  </div>
</header>
