<!-- 2. NAVIGATION BAR -->
<header
  class="sticky top-0 z-40 bg-white/70 backdrop-blur-md border-b border-stone-100"
>
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="index.html" class="hover:opacity-80 transition-opacity">
      <img
        src="img/logo.png"
        alt="Logo citiwear.basic"
        class="h-6 w-auto object-contain"
      />
    </a>

    <!-- Filter Kategori Desktop -->
    <nav
      class="hidden md:flex space-x-10 text-[11px] font-semibold tracking-[0.2em] uppercase"
    >
      <button
        @click="currentCategory = 'all'"
        :class="currentCategory === 'all' ? 'text-black border-b border-black' : 'text-stone-400 hover:text-black'"
        class="pb-1 transition-all duration-300"
      >
        All
      </button>
      <button
        @click="currentCategory = 'tshirt'"
        :class="currentCategory === 'tshirt' ? 'text-black border-b border-black' : 'text-stone-400 hover:text-black'"
        class="pb-1 transition-all duration-300"
      >
        T-Shirts
      </button>
      <!-- <button
            @click="currentCategory = 'pants'"
            :class="currentCategory === 'pants' ? 'text-black border-b border-black' : 'text-stone-400 hover:text-black'"
            class="pb-1 transition-all duration-300"
          >
            Pants
          </button> -->
    </nav>

    <!-- Ikon Keranjang Belanja -->
    <button
      @click="cartOpen = true"
      class="flex items-center space-x-1.5 text-stone-700 hover:text-black transition group relative"
    >
      <svg
        class="h-5 w-5 stroke-[1.25]"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 10.5V6a3.75 3.75 0 1,0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0,1-1.119-1.243l1.264-12A1.125 1.125 0 0,1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1,1-.75 0 .375.375 0 0,1 .75 0Zm7.5 0a.375.375 0 1,1-.75 0 .375.375 0 0,1 .75 0Z"
        />
      </svg>
      <span
        class="text-xs font-medium bg-stone-900 text-white min-w-[18px] h-[18px] flex items-center justify-center rounded-full text-[10px]"
        x-text="cartCount()"
        >0</span
      >
    </button>
  </div>
</header>
