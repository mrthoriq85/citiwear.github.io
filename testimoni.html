<section class="testimonial-section py-12" aria-labelledby="testimonial-heading">
  <h2 id="testimonial-heading" class="sr-only">Testimoni Pelanggan</h2>
  <p class="text-center text-stone-600 text-sm mb-6">
    Geser untuk melihat ulasan & foto asli pembeli &rarr;
  </p>

  <div class="testimonial-slider flex gap-4 overflow-x-auto pb-4 invisible-scrollbar">
    <!-- Menggunakan loop Alpine atau rendering standar dengan lazy loading -->
    <template x-for="i in 22" :key="i">
      <div class="testimonial-card-img flex-shrink-0 w-64 h-80 bg-stone-100 rounded-lg overflow-hidden">
        <img 
          :src="'img/testimoni/${i}.webp'" 
          :alt="'Testimoni Pembeli ${i}'" 
          loading="lazy" 
          decoding="async"
          width="256"
          height="320"
          class="w-full h-full object-cover" 
        />
      </div>
    </template>
  </div>
</section>
